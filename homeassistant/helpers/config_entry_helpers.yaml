- domain: template
  title: Power
  options:
    additional_options:
      availability: '{{ is_state(''binary_sensor.sundance_spa_status'', ''on'') }}'
    device_class: power
    name: Spa Power
    state: >-
      {# Spa electrical power from the ESP states x the power values set on the spa device
      (number.sundance_spa_power_*, kept on the ESP). Pump 1 = Pump 1 Running: at high (Jet 1
      switch) = Jet Pump + ClearRay, at low = Circulation (includes the ClearRay bulb); Pump 2 =
      Pump 2 Running x Jet Pump; heater; light; controller always. #}{% set p1 =
      is_state('binary_sensor.sundance_spa_pump_1_running', 'on') %}{% set p1_high =
      is_state('switch.sundance_spa_jet_1', 'on') %}{% set p2 =
      is_state('binary_sensor.sundance_spa_pump_2_running', 'on') %}{% set heat =
      is_state('binary_sensor.sundance_spa_heater', 'on') %}{% set light =
      states('sensor.sundance_spa_light_status') not in ['Off', 'unknown', 'unavailable'] %}{% set
      ctrl = states('number.sundance_spa_power_controller') | float(15) %}{% set uv =
      states('number.sundance_spa_power_clearray') | float(20) %}{% set lt =
      states('number.sundance_spa_power_light') | float(5) %}{% set circ =
      states('number.sundance_spa_power_circulation') | float(370) %}{% set jet =
      states('number.sundance_spa_power_jet_pump') | float(1630) %}{% set heater =
      states('number.sundance_spa_power_heater') | float(2700) %}{{ (ctrl + ((jet + uv) if p1_high
      else (circ if p1 else 0)) + (jet if p2 else 0) + (heater if heat else 0) + (lt if light else
      0)) | round(0) }}
    state_class: measurement
    template_type: sensor
    unit_of_measurement: W
