- domain: template
  title: Spa Next Plan
  options:
    name: Spa Next Plan
    state: >-
      {%- set ns = namespace(ts=0, p=[]) -%}{%- for i in range(1, 6) -%}{%- set p =
      states('input_text.spa_plan_' ~ i).split(';') -%}{%- if p | count == 5 and
      is_state('input_boolean.spa_plan_' ~ i ~ '_on', 'on') and p[2] |
      regex_match('^[0-9]{2}:[0-9]{2}$') -%}{%- set base = today_at(p[2]) -%}{%- for d in range(0,
      8) -%}{%- set dt = base + timedelta(days=d) -%}{%- set ok = (p[3] == 'daily') or (p[3] ==
      'once' and (dt.date() | string) == p[4]) or (p[3] not in ['daily', 'once'] and (dt.weekday() |
      string) in p[3]) -%}{%- if ok and dt > now() -%}{%- set ts = as_timestamp(dt) | int -%}{%- if
      ns.ts == 0 or ts < ns.ts -%}{%- set ns.ts = ts -%}{%- set ns.p = p -%}{%- endif -%}{%- endif
      -%}{%- endfor -%}{%- endif -%}{%- endfor -%}{%- if ns.ts == 0 -%}none{%- else -%}{%- set p =
      ns.p -%}{%- set c = p[1] | float(0) -%}{%- set t = ((c * 9 / 5 + 32) | round(0) | int ~ '°F')
      if is_state('sensor.sundance_spa_temperature_format', '°F') else (('%g' % c) ~ '°C') -%}{%-
      set dd = (as_local(as_datetime(ns.ts)).date() - now().date()).days -%}{%- set when = 'today'
      if dd == 0 else ('tomorrow' if dd == 1 else 'on ' ~ ns.ts | timestamp_custom('%a %d/%m'))
      -%}{%- if p[0] == 'R' -%}Hot Tub will be ready by {{ p[2] }} {{ when }} with {{ t }}{%- else
      -%}Hot Tub will start heating at {{ p[2] }} {{ when }} to {{ t }}{%- endif -%}{%- endif -%}
    template_type: sensor
