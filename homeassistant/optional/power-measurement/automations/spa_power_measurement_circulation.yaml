alias: 'Spa - Power measurement: circulation (nightly)'
description: >-
  Measures the circulation power (Pump 1 low + ClearRay, number.sundance_spa_power_circulation)
  against the setting. The filter cycle runs 00:00-02:00 and the house load hardly changes at night
  (owner, 2026-10-29), so: average house load 00:05-01:55 (circulation) minus the spa-idle base from
  the quiet window 02:05-03:00 and, when it stayed quiet, also 03:00-03:55 (the base is the average
  of the two; they must differ by less than 150 W). Averages come from
  sensor.house_load_energy_spa_calibration (Riemann sum of sensor.load_power). MEASUREMENT ONLY -
  never changes the setting; each night is logged and appended to
  input_text.spa_power_measure_circulation through script.spa_power_measure_record, for the weekly
  summary. A plausible result is 200-700 W. Skipped (and recorded with the reason) if the heater or
  a jet ran, or the pump changed, in the circulation window or in 02:05-03:00.


  History: created 2026-10-29. 2026-11-02 (owner): measurement only. 2026-11-06: results appended to
  the helper. 2026-11-07: non-numeric start value ignored. 2026-11-08 (owner): a short ESP
  disconnect no longer voids the night. Revised 2026-11-11 (owner): the heater starting during the
  second quiet window (03:00-03:55) no longer voids the night - the first window alone is used (that
  night is marked 'single window'); every skipped night is recorded with its reason (it used to drop
  silently; the heater run at 03:28 on 11 Nov dropped the night with no trace). The heater run
  itself is measured by 'Spa - Power measurement: heater (per run)'.
triggers:
  - trigger: time
    at: '00:05:00'
conditions:
  - condition: state
    entity_id: binary_sensor.sundance_spa_pumps_running
    state: 'on'
  - condition: state
    entity_id: binary_sensor.sundance_spa_heater
    state: 'off'
  - condition: state
    entity_id: binary_sensor.sundance_spa_in_use
    state: 'off'
actions:
  - variables:
      e0: '{{ states(''sensor.house_load_energy_spa_calibration'') }}'
      old: '{{ states(''number.sundance_spa_power_circulation'') | float(370) }}'
  - wait_for_trigger:
      - trigger: time
        at: '01:55:00'
        id: end
      - trigger: state
        entity_id: binary_sensor.sundance_spa_heater
        to: 'on'
        id: disturbed
      - trigger: state
        entity_id: binary_sensor.sundance_spa_in_use
        to: 'on'
        id: disturbed
      - trigger: state
        entity_id: binary_sensor.sundance_spa_pumps_running
        to: 'off'
        id: disturbed
    timeout:
      hours: 2
    continue_on_timeout: false
  - if:
      - condition: or
        conditions:
          - condition: template
            value_template: '{{ wait.trigger.id == ''disturbed'' }}'
          - condition: not
            conditions:
              - condition: state
                entity_id: binary_sensor.sundance_spa_pumps_running
                state: 'on'
          - condition: not
            conditions:
              - condition: state
                entity_id: binary_sensor.sundance_spa_heater
                state: 'off'
          - condition: not
            conditions:
              - condition: state
                entity_id: binary_sensor.sundance_spa_in_use
                state: 'off'
    then:
      - action: script.spa_power_measure_record
        data:
          kind: circulation
          measured: ''
          old: '{{ old }}'
          message: >-
            night skipped: the heater, a jet or the pump changed during the circulation window
            00:05-01:55
      - stop: circulation window disturbed
    note: >-
      State only: a short ESP disconnect (unavailable) does not void the night; real disturbances
      are caught by the triggers of the waits.
  - variables:
      e1: '{{ states(''sensor.house_load_energy_spa_calibration'') }}'
  - wait_for_trigger:
      - trigger: time
        at: '02:05:00'
    timeout:
      minutes: 20
    continue_on_timeout: false
  - if:
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.sundance_spa_pumps_running
            state: 'off'
    then:
      - action: script.spa_power_measure_record
        data:
          kind: circulation
          measured: ''
          old: '{{ old }}'
          message: 'night skipped: the pump was still running at 02:05'
      - stop: pump still running at 02:05
  - variables:
      e2: '{{ states(''sensor.house_load_energy_spa_calibration'') }}'
  - wait_for_trigger:
      - trigger: time
        at: '03:00:00'
        id: end
      - trigger: state
        entity_id: binary_sensor.sundance_spa_heater
        to: 'on'
        id: disturbed
      - trigger: state
        entity_id: binary_sensor.sundance_spa_in_use
        to: 'on'
        id: disturbed
      - trigger: state
        entity_id: binary_sensor.sundance_spa_pumps_running
        to: 'on'
        id: disturbed
    timeout:
      hours: 1
    continue_on_timeout: false
  - if:
      - condition: template
        value_template: '{{ wait.trigger.id == ''disturbed'' }}'
    then:
      - action: script.spa_power_measure_record
        data:
          kind: circulation
          measured: ''
          old: '{{ old }}'
          message: 'night skipped: the heater, a jet or the pump started during the quiet window 02:05-03:00'
      - stop: first quiet window disturbed
  - variables:
      e3: '{{ states(''sensor.house_load_energy_spa_calibration'') }}'
  - wait_for_trigger:
      - trigger: time
        at: '03:55:00'
        id: end
      - trigger: state
        entity_id: binary_sensor.sundance_spa_heater
        to: 'on'
        id: disturbed
      - trigger: state
        entity_id: binary_sensor.sundance_spa_in_use
        to: 'on'
        id: disturbed
      - trigger: state
        entity_id: binary_sensor.sundance_spa_pumps_running
        to: 'on'
        id: disturbed
    timeout:
      hours: 1
    continue_on_timeout: false
  - variables:
      two_windows: '{{ wait.trigger.id != ''disturbed'' }}'
      e4: '{{ states(''sensor.house_load_energy_spa_calibration'') }}'
  - if:
      - condition: template
        value_template: >-
          {{ not (is_number(e0) and is_number(e1) and is_number(e2) and is_number(e3) and
          (is_number(e4) or not two_windows)) }}
    then:
      - action: script.spa_power_measure_record
        data:
          kind: circulation
          measured: ''
          old: '{{ old }}'
          message: 'night skipped: the house load energy sensor was not available'
      - stop: energy sensor unavailable
  - variables:
      circ_w: '{{ ((e1 | float - e0 | float) * 1000 / (110 / 60)) | round(0) }}'
      q1: '{{ ((e3 | float - e2 | float) * 1000 / (55 / 60)) | round(0) }}'
      q2: '{{ (((e4 | float - e3 | float) * 1000 / (55 / 60)) | round(0)) if two_windows else none }}'
  - variables:
      base: '{{ (((q1 | float + q2 | float) / 2) if two_windows else q1 | float) | round(0) }}'
  - variables:
      measured: '{{ (circ_w | float - base | float) | round(0) }}'
  - if:
      - condition: template
        value_template: >-
          {{ 200 <= measured | float <= 700 and ((q1 | float - q2 | float) | abs < 150 if
          two_windows else true) }}
    then:
      - action: script.spa_power_measure_record
        data:
          kind: circulation
          measured: '{{ measured }}'
          old: '{{ old }}'
          message: >-
            circulation measured {{ measured }} W (house {{ circ_w }} W, base {{ base }} W{{ '' if
            two_windows else ', single window - the heater started after 03:00' }}); setting {{ old
            | round(0) }} W, difference {{ ((measured | float - old) / old * 100) | round(1) }}%
    else:
      - action: script.spa_power_measure_record
        data:
          kind: circulation
          measured: ''
          old: '{{ old }}'
          message: >-
            night skipped: base {{ q1 }}/{{ q2 }} W, circulation {{ circ_w }} W, measured {{
            measured }} W
mode: single
