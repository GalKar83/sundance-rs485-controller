alias: Spa - Add heating plan
description: >-
  Adds the plan from the form on the Hot Tub Settings page (input_select.spa_plan_mode /
  spa_plan_repeat, input_select.spa_plan_temperature - in the panel unit; values of 50 and up are °F
  and stored as the nearest half °C, input_datetime.spa_plan_when, input_boolean.spa_plan_sun..sat)
  to the first free slot input_text.spa_plan_1..5 as 'mode;temp_c;HH:MM;days;date' (mode R = ready
  by, S = start heating; days 'once', 'daily' or weekday digits Mon=0..Sun=6; date YYYY-MM-DD for
  once). Refused with a notice in HA when: no free slot, a one-off time already passed, or chosen
  days without a day. Created 2026-11-03. A new plan is switched on (input_boolean.spa_plan_N_on).
mode: single
sequence:
  - variables:
      panel_f: '{{ is_state(''sensor.sundance_spa_temperature_format'', ''°F'') }}'
      temp_c: >-
        {%- set v = states('input_select.spa_plan_temperature') | float(38) -%}{%- if v >= 50 -%}{{
        ((v - 32) * 10 / 9) | round(0) / 2 }}{%- else -%}{{ v }}{%- endif -%}
      when_ts: '{{ state_attr(''input_datetime.spa_plan_when'', ''timestamp'') | float(0) }}'
      hhmm: '{{ when_ts | timestamp_custom(''%H:%M'') }}'
      rep: '{{ states(''input_select.spa_plan_repeat'') }}'
      days: >-
        {%- set ns = namespace(d='') -%}{%- for name, wd in
        [('mon',0),('tue',1),('wed',2),('thu',3),('fri',4),('sat',5),('sun',6)] -%}{%- if
        is_state('input_boolean.spa_plan_' ~ name, 'on') -%}{%- set ns.d = ns.d ~ wd -%}{%- endif
        -%}{%- endfor -%}{{ 'once' if rep == 'Once' else ('daily' if rep == 'Daily' else ns.d) }}
      slot: >-
        {%- set ns = namespace(s=0) -%}{%- for i in range(1, 6) -%}{%- if ns.s == 0 and
        states('input_text.spa_plan_' ~ i) in ['', 'unknown', 'unavailable'] -%}{%- set ns.s = i
        -%}{%- endif -%}{%- endfor -%}{{ ns.s }}
      problem: >-
        {%- if slot | int == 0 -%}All 5 plan slots are in use - delete one first.{%- elif rep ==
        'Once' and when_ts <= as_timestamp(now()) -%}That date and time has already passed.{%- elif
        rep == 'Chosen days' and days == '' -%}Choose at least one day.{%- endif -%}
  - if:
      - condition: template
        value_template: '{{ problem != '''' }}'
    then:
      - action: persistent_notification.create
        data:
          title: Spa heating plan not added
          message: '{{ problem }}'
          notification_id: spa_plan_add
      - stop: Invalid plan
  - action: input_text.set_value
    target:
      entity_id: input_text.spa_plan_{{ slot }}
    data:
      value: >-
        {{ 'S' if is_state('input_select.spa_plan_mode', 'Start heating') else 'R' }};{{ temp_c
        }};{{ hhmm }};{{ days }};{{ when_ts | timestamp_custom('%Y-%m-%d') if rep == 'Once' else '-'
        }}
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.spa_plan_{{ slot }}_on
  - action: persistent_notification.dismiss
    data:
      notification_id: spa_plan_add
