alias: 'Spa - Settings dropdowns: send a change'
description: >-
  When a dropdown on the Hot Tub Settings page is set to a value different from the spa's, sends it
  to the spa through the ESP's setting controls (number.sundance_spa_primary_filter_start_hour /
  _filter_change_days / _clearray_days / _water_refresh_days; Off = 0). The ESP walks the topside
  menu; the dropdown then follows the value read back ('Spa - Settings dropdowns: follow the spa'),
  so a failed change returns to the old value. Created 2026-11-03. Revised 2026-11-08: only a change
  made by a person (context user_id set) is sent. The follow-the-spa automation also changes these
  dropdowns, copying the live values the ESP publishes while it walks the menu (e.g. 165, 170, 180,
  Off, 10), and that fed back into a second write: Filter Change 165 -> 10 was saved, then the stale
  intermediate Off was written.
triggers:
  - trigger: state
    entity_id: input_select.spa_set_pf_start
    id: pf
    not_to:
      - unknown
      - unavailable
  - trigger: state
    entity_id: input_select.spa_set_filter_change
    id: fc
    not_to:
      - unknown
      - unavailable
  - trigger: state
    entity_id: input_select.spa_set_clearray
    id: uv
    not_to:
      - unknown
      - unavailable
  - trigger: state
    entity_id: input_select.spa_set_water_refresh
    id: h2o
    not_to:
      - unknown
      - unavailable
actions:
  - alias: Only a pick made by a person on the dashboard
    condition: template
    value_template: '{{ trigger.to_state.context.user_id is not none }}'
  - variables:
      src: >-
        {{ {'pf': 'sensor.sundance_spa_primary_filter_start', 'fc':
        'sensor.sundance_spa_remaining_days_filter_change', 'uv':
        'sensor.sundance_spa_remaining_days_clearray_bulb', 'h2o':
        'sensor.sundance_spa_remaining_days_water_refresh'}[trigger.id] }}
      dst: >-
        {{ {'pf': 'number.sundance_spa_primary_filter_start_hour', 'fc':
        'number.sundance_spa_filter_change_days', 'uv': 'number.sundance_spa_clearray_days', 'h2o':
        'number.sundance_spa_water_refresh_days'}[trigger.id] }}
  - condition: template
    value_template: >-
      {%- set pick = trigger.to_state.state | string -%}{{ pick != (states(src) | string) and pick
      != '-' and (pick == 'Off' or pick | regex_match('^[0-9]{1,3}$') or pick |
      regex_match('^[0-9]{2}:00$')) }}
    note: >-
      Only a real change to a grid value. Compared as text: a variable holding 141 renders as a
      number and never equals the state string (bug of 2026-11-03 that sent the current values).
  - action: number.set_value
    target:
      entity_id: '{{ dst }}'
    data:
      value: >-
        {%- set pick = trigger.to_state.state | string -%}{{ 0 if pick == 'Off' else (pick[:2] | int
        if trigger.id == 'pf' else pick | int) }}
mode: queued
max: 10
