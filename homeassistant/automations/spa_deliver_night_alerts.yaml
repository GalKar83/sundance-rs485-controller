alias: Spa - Deliver night alerts
description: >-
  When the spa quiet hours end (06:30 by default; or on HA start outside the quiet hours, in case HA
  was down then) sends the spa information notifications queued overnight by script.spa_notify
  (input_text.spa_night_alerts) as one phone notification, then clears the queue. Created
  2026-11-01. Revised 2026-11-08: the quiet hours are the two time helpers set on the Hot Tub
  Settings page (input_datetime.spa_quiet_hours_start / _end).
triggers:
  - trigger: time
    at: input_datetime.spa_quiet_hours_end
  - trigger: homeassistant
    event: start
conditions:
  - condition: time
    after: input_datetime.spa_quiet_hours_end
    before: input_datetime.spa_quiet_hours_start
  - condition: not
    conditions:
      - condition: state
        entity_id: input_text.spa_night_alerts
        state:
          - ''
          - unknown
          - unavailable
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: 'Spa: overnight alerts'
      message: '{{ states(''input_text.spa_night_alerts'') | replace(''; '', ''\n'') }}'
      data:
        tag: spa_night_alerts
        ttl: 0
        priority: high
  - action: input_text.set_value
    target:
      entity_id: input_text.spa_night_alerts
    data:
      value: ''
mode: single
