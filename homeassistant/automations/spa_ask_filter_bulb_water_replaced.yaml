alias: 'Spa - Ask: Filter/ClearRay Bulb/Water Replaced?'
description: >-
  When a spa service counter is reset on the panel (Remaining Days Filter Change / ClearRay Bulb /
  Water Refresh: days jump up, or Off / Change Now -> days), ask the owner's phone whether the item
  was actually replaced. Yes -> the matching Last Replacement ... Date is set to the reset date. No
  or no answer within 12 h -> nothing changes (covers test resets). unknown/unavailable (ESP reboot)
  are ignored. Counters are text since ESP patch 17 (2026-10-25): days, 'Change Now' or 'Off'.
  Revised 2026-10-28: entities renamed (sensor.sundance_spa_remaining_days_*,
  input_datetime.last_replacement_*_date). Revised 2026-11-01: no question in the spa quiet hours
  23:00-06:30 by default, set on the Hot Tub Settings page - it waits and asks when they end.
  Revised 2026-11-03: asked only within 12 h after a real power cut
  (input_datetime.spa_last_power_cut, set by the outage automation when the spa date was reset) -
  counters are also edited from HA now, and a real replacement always follows switching the spa off.
  Revised 2026-11-08: for the Filter counter only, a Service Lock that ended within the last 12 h
  (input_datetime.spa_last_service_lock_end, set by Spa - After a Service Lock: filter rinsed?) also
  allows the question; ClearRay bulb and Water still need a real power cut. Revised 2026-11-08: the
  Filter question is skipped when input_datetime.last_replacement_filter_date is already today (the
  Replaced button of the rinse question set it). Revised 2026-11-08: quiet hours from
  binary_sensor.spa_quiet_hours (the two time helpers).
triggers:
  - trigger: state
    entity_id: sensor.sundance_spa_remaining_days_filter_change
    id: filter
    note: Counter reset on the panel
  - trigger: state
    entity_id: sensor.sundance_spa_remaining_days_clearray_bulb
    id: clearray_bulb
  - trigger: state
    entity_id: sensor.sundance_spa_remaining_days_water_refresh
    id: water
conditions:
  - condition: template
    value_template: >-
      {% set f = trigger.from_state.state %}{% set t = trigger.to_state.state %}{{ is_number(t) and
      ((is_number(f) and t | float > f | float) or f in ['Off', 'Change Now']) }}
    note: >-
      A reset = the days go up (normal daily change is -1), or a number appears after Off / Change
      Now. unknown/unavailable (ESP reboot) never count. No native condition compares old vs new
      state.
  - condition: template
    value_template: >-
      {%- set now_ts = as_timestamp(now()) -%}{%- set cut =
      state_attr('input_datetime.spa_last_power_cut', 'timestamp') | float(0) -%}{%- set svl =
      state_attr('input_datetime.spa_last_service_lock_end', 'timestamp') | float(0) -%}{{ now_ts -
      cut < 12 * 3600 or (trigger.id == 'filter' and now_ts - svl < 12 * 3600) }}
    note: >-
      Owner's rule: a filter, bulb or water change always starts with the spa switched off, so a
      reset is only asked about within 12 h after a real power cut (spa date reset to 01/01/2014).
      Only the filter can also be done under a Service Lock, so for the Filter counter a Service
      Lock that ended in the last 12 h (input_datetime.spa_last_service_lock_end) counts too.
      Otherwise the value was just edited, e.g. from HA.
  - alias: Not again when the filter was already marked replaced today
    condition: template
    value_template: >-
      {{ not (trigger.id == 'filter' and states('input_datetime.last_replacement_filter_date') ==
      (now().date() | string)) }}
    note: >-
      The Replaced button of the rinse question (after a power cut or a Service Lock) already set
      today's date, so the counter reset does not ask again. Filter only.
actions:
  - variables:
      item: '{{ {''filter'': ''Filter'', ''clearray_bulb'': ''ClearRay bulb'', ''water'': ''Water''}[trigger.id] }}'
      target_entity: '{{ ''input_datetime.last_replacement_'' ~ trigger.id ~ ''_date'' }}'
      reset_date: '{{ now().date() | string }}'
      tag: spa_replace_{{ trigger.id }}_{{ as_timestamp(now()) | int }}
  - wait_template: '{{ is_state(''binary_sensor.spa_quiet_hours'', ''off'') }}'
    timeout:
      hours: 8
    continue_on_timeout: true
    note: >-
      Spa quiet hours (set on the Hot Tub Settings page): ask when they end. The recorded date stays
      the reset date.
  - action: notify.mobile_app_your_phone
    data:
      title: Spa counter reset
      message: >-
        {{ item }} counter was reset to {{ trigger.to_state.state | int }} days. Was the {{ item |
        lower }} replaced?
      data:
        tag: '{{ tag }}'
        actions:
          - action: YES_{{ tag }}
            title: Yes
          - action: NO_{{ tag }}
            title: No
        sticky: true
        persistent: true
        clickAction: noAction
        priority: high
        ttl: 0
  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: YES_{{ tag }}
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: NO_{{ tag }}
    timeout:
      hours: 12
    continue_on_timeout: true
  - if:
      - condition: template
        value_template: '{{ wait.trigger is not none and wait.trigger.event.data.action == ''YES_'' ~ tag }}'
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: '{{ target_entity }}'
        data:
          date: '{{ reset_date }}'
        note: Date of the reset, not of the answer
    note: 'No or no answer: date unchanged.'
  - action: notify.mobile_app_your_phone
    data:
      message: clear_notification
      data:
        tag: '{{ tag }}'
mode: parallel
max: 5
