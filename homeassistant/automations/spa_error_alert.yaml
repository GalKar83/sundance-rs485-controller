alias: Spa - Error alert
description: >-
  Tells the owner's phone when the spa reports an error code that is not one of the three service
  reminders. The ESP publishes sensor.sundance_spa_alert from the last byte of the status frame:
  None, Change Filter, Change Water, Change ClearRay Bulb (these three are already covered by the
  counters and 'Spa - Service counter reached 0'), a fault name from the Jacuzzi / Prolink error
  table (only codes 1 and 3 are confirmed on a 680, the rest is by analogy: flow switch, temperature
  sensor, water too hot, freeze, COOL), or 'Unknown
  error (code N)' for any number that is not in the table. Sent through script.spa_notify, so in the
  spa quiet hours (23:00-06:30 by default) it is held until they end. A second message says when the
  error is gone. Created 2026-11-16 for the Alert sensor. Revised 2026-11-16: the message carries the same explanation sentence as
  the dashboard banner, and tapping the notification opens the Hot Tub page (the banner there stays until the error is gone).
  Revised 2026-11-18: the Jacuzzi-only codes that the 680 manuals do not have (controller temperature, depth filter, shorted
  flow switch, light sensor, stereo) were removed from the firmware (patch 43) and from the explanations here; such a code now
  shows as Unknown error (code N).
triggers:
  - trigger: state
    entity_id: sensor.sundance_spa_alert
    not_to:
      - None
      - Change Filter
      - Change Water
      - Change ClearRay Bulb
      - unknown
      - unavailable
    not_from:
      - unknown
      - unavailable
    id: fault
  - trigger: state
    entity_id: sensor.sundance_spa_alert
    to: None
    not_from:
      - None
      - Change Filter
      - Change Water
      - Change ClearRay Bulb
      - unknown
      - unavailable
    id: cleared
actions:
  - variables:
      alert: '{{ trigger.to_state.state }}'
      explanation: >-
        {%- set m = {'Flow switch open (FL-1)': 'The flow switch reads open, so the heater is
        disabled. Usually the pump 1 filter is very dirty or an air lock formed at the pump intake:
        clean the filter and let the air out. Call your dealer if it stays.', 'Flow switch closed
        (FL-2)': 'The flow switch reads closed when it should be open, so the heater is disabled.
        Call your dealer or service organization.', 'Temperature sensor fault (SN)': 'A temperature
        sensor is not working (high-limit sensor SN-1 or water sensor SN-2), so the heater is
        disabled. Call your dealer or service organization.', 'Water too hot - do not enter the
        water': 'The water is above the safe limit (44 °C) and the spa is deactivated. Do not enter
        the water. Remove the cover to cool it faster; if it persists, call your dealer or service
        organization.', 'Water 20 F below set point (COOL), heating': 'The water is more than 11 °C
        (20 °F) below the set point, so the heater and pump 1 run until it is within 8 °C (15 °F).
        No action is needed; it is common after filling with cold water.', 'Potential freeze (ICE),
        pumps running': 'A freeze condition may be starting, so the pumps and heater run until the
        danger has passed. No action is needed; call your dealer if it persists.'} -%}{%- set s =
        alert -%}{{ m[s] if s in m else 'The spa reported an error code that is not in the table of
        known codes. Read the message on the spa panel, look it up in the owner\'s manual (section
        13), and tell Claude what it says so it can be added. The heater may be disabled.' }}
  - choose:
      - conditions:
          - condition: trigger
            id: fault
        sequence:
          - action: script.spa_notify
            data:
              title: Spa error
              message: '{{ alert }} ({{ now().strftime(''%d/%m/%Y %H:%M'') }}). {{ explanation }}'
              tag: spa_error
              url: /home-control/hot-tub
      - conditions:
          - condition: trigger
            id: cleared
        sequence:
          - action: script.spa_notify
            data:
              title: Spa error cleared
              message: '{{ trigger.from_state.state }} is gone ({{ now().strftime(''%d/%m/%Y %H:%M'') }}).'
              tag: spa_error
              url: /home-control/hot-tub
mode: queued
max: 5
