alias: Spa - Panel used while the owner is away
description: >-
  When a button is pressed on the topside panel (sensor.sundance_spa_panel_button - physical
  presses only; actions from HA never appear there) while the owner is not home, notify ONCE per
  absence: input_boolean.spa_panel_alert_sent blocks further alerts until the owner is home again.
  Replace person.owner with your person entity.
triggers:
  - trigger: state
    entity_id: sensor.sundance_spa_panel_button
    not_to: ["Idle", "unknown", "unavailable"]
    id: press
  - trigger: state
    entity_id: person.owner
    to: home
    id: home
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: home
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.spa_panel_alert_sent
      - conditions:
          - condition: trigger
            id: press
          - condition: not
            conditions:
              - condition: state
                entity_id: person.owner
                state: home
          - condition: state
            entity_id: input_boolean.spa_panel_alert_sent
            state: "off"
        sequence:
          - action: notify.mobile_app_your_phone
            data:
              title: Spa panel used
              message: >-
                Someone pressed '{{ trigger.to_state.state }}' on the spa panel at
                {{ now().strftime('%H:%M') }} while you are away.
              data:
                tag: spa_panel_used
                priority: high
                ttl: 0
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.spa_panel_alert_sent
mode: queued
max: 5
