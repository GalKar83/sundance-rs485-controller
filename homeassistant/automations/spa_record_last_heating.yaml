alias: Spa - Record Last Heating
description: >-
  Writes "lowest → highest °C · minutes · start" of each heating run
  (binary_sensor.sundance_spa_heating_run) to input_text.spa_last_heating and the logbook.
  Stateless - no long waits, so an automation reload or HA restart in the middle of a run loses
  nothing: the open run is kept in input_text.spa_heating_run_data as "start_ts;min;max"
  (empty = no run). Start: min = the current water temperature, or the last drop recorded within
  30 s before the run (input_text.spa_temp_last_drop "ts;temp") if lower - the reading that starts
  a heat call often lasts only 1-3 s, before the 2 s-confirmed heating_run turns on. While a run is
  open every temperature reading widens min/max; max = the temperature reached (the readings
  flicker by 0.5 at the end). End: any change of heating_run to off (also via unavailable).
triggers:
  - trigger: state
    entity_id: binary_sensor.sundance_spa_heating_run
    from: "off"
    to: "on"
    id: start
  - trigger: state
    entity_id: binary_sensor.sundance_spa_heating_run
    not_from: "off"
    to: "off"
    id: end
  - trigger: state
    entity_id: climate.sundance_spa
    attribute: current_temperature
    id: temp
actions:
  - variables:
      run: "{{ states('input_text.spa_heating_run_data') }}"
      is_open: "{{ run.split(';') | count == 3 }}"
  - choose:
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - variables:
              cur: "{{ state_attr('climate.sundance_spa', 'current_temperature') | float(0) }}"
              since: "{{ as_timestamp(trigger.to_state.last_changed) | int }}"
              drop: "{{ states('input_text.spa_temp_last_drop').split(';') }}"
              low: >-
                {% if drop | count == 2 and since - drop[0] | float(0) <= 30 %}{{ [cur, drop[1] | float(99)] | min }}{% else %}{{ cur }}{% endif %}
          - action: input_text.set_value
            target:
              entity_id: input_text.spa_heating_run_data
            data:
              value: "{{ since }};{{ low }};{{ cur }}"
      - conditions:
          - condition: trigger
            id: temp
          - condition: template
            value_template: "{{ trigger.to_state.attributes.current_temperature is number }}"
        sequence:
          - variables:
              t: "{{ trigger.to_state.attributes.current_temperature | float }}"
          - if:
              - condition: template
                value_template: "{{ is_open }}"
            then:
              - variables:
                  p: "{{ run.split(';') }}"
                  mn: "{{ [p[1] | float, t] | min }}"
                  mx: "{{ [p[2] | float, t] | max }}"
              - if:
                  - condition: template
                    value_template: "{{ mn != p[1] | float or mx != p[2] | float }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.spa_heating_run_data
                    data:
                      value: "{{ p[0] }};{{ mn }};{{ mx }}"
            else:
              # No run open: remember the last drop, a heat call may start right after it.
              - if:
                  - condition: template
                    value_template: >-
                      {{ trigger.from_state.attributes.current_temperature is number
                         and t < trigger.from_state.attributes.current_temperature }}
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.spa_temp_last_drop
                    data:
                      value: "{{ as_timestamp(trigger.to_state.last_updated) | int }};{{ t }}"
      - conditions:
          - condition: trigger
            id: end
          - condition: template
            value_template: "{{ is_open }}"
        sequence:
          - variables:
              p: "{{ run.split(';') }}"
              summary: >-
                {{ '%.1f' % (p[1] | float) }} → {{ '%.1f' % (p[2] | float) }} °C ·
                {{ ((as_timestamp(now()) - p[0] | float) / 60) | round(0) | int }} min ·
                {{ (p[0] | int) | timestamp_custom('%d/%m %H:%M') }}
          - action: input_text.set_value
            target:
              entity_id: input_text.spa_last_heating
            data:
              value: "{{ summary }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.spa_heating_run_data
            data:
              value: ""
          - action: logbook.log
            data:
              name: Spa heating
              message: "{{ summary }}"
              entity_id: climate.sundance_spa
mode: queued
max: 20
