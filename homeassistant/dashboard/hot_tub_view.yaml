title: Hot Tub
path: hot-tub
icon: mdi:hot-tub
subview: true
back_path: /home-control/home
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Control Panel
        heading_style: title
        icon: mdi:camera-control
      - type: tile
        entity: switch.sundance_spa_jet_1
        name: Jet 1
        grid_options:
          columns: 6
      - type: tile
        entity: switch.sundance_spa_jet_2
        name: Jet 2
        grid_options:
          columns: 6
      - type: tile
        entity: switch.sundance_spa_circulation
        name: Manual
        grid_options:
          columns: 6
      - type: tile
        entity: binary_sensor.sundance_spa_circulation_auto
        name: Auto
        icon: mdi:sync
        grid_options:
          columns: 6
        color: blue
      - type: custom:mushroom-template-card
        entity: select.sundance_spa_light
        primary: Light
        secondary: '{{ states(''select.sundance_spa_light'') }}'
        icon: mdi:lightbulb
        icon_color: >-
          {% set s = states('select.sundance_spa_light') %}{% set colors =
          {'Blue':'blue','Violet':'purple','Red':'red','Amber':'amber','Green':'green','Aqua':'cyan','Near
          White':'white','High Speed Blend':'pink','Low Speed Blend':'pink','Frozen
          Blend':'light-blue'} %}{{ colors.get(s, 'grey') }}
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: climate.sundance_spa
        primary: Temperature
        secondary: >-
          {%- set pf = is_state('sensor.sundance_spa_temperature_format', '°F') -%}{%- set w =
          state_attr('climate.sundance_spa', 'current_temperature') | float(0) -%}{%- set g =
          state_attr('climate.sundance_spa', 'temperature') | float(0) -%}{%- if pf -%}Water {{ (w *
          9 / 5 + 32) | round(0) | int }}°F · Target {{ (g * 9 / 5 + 32) | round(0) | int }}°F{%-
          else -%}Water {{ '%.1f' % w }}°C · Target {{ '%.1f' % g }}°C{%- endif -%}
        icon: mdi:thermometer
        icon_color: orange
        tap_action:
          action: more-info
        grid_options:
          columns: 8
          rows: 1
        card_mod:
          style: 'ha-card { --card-secondary-font-size: 10px; --ha-tile-info-secondary-font-size: 10px; }'
      - type: custom:mushroom-template-card
        primary: ''
        secondary: ''
        layout: vertical
        icon: mdi:minus
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: script.spa_target_step
          data:
            direction: -1
        grid_options:
          columns: 2
          rows: 1
      - type: custom:mushroom-template-card
        primary: ''
        secondary: ''
        layout: vertical
        icon: mdi:plus
        icon_color: red
        tap_action:
          action: perform-action
          perform_action: script.spa_target_step
          data:
            direction: 1
        grid_options:
          columns: 2
          rows: 1
      - type: custom:mushroom-template-card
        entity: sensor.sundance_spa_primary_filter
        primary: Current Status
        secondary: >-
          {%- set m = states('sensor.sundance_spa_heater_mode') -%}{%- set h = now().hour -%}{%- set
          blocked = ((m == 'Eco' and 7 <= h < 17) or (m == 'Day' and not (7 <= h < 17))) and not
          is_state('binary_sensor.sundance_spa_heater', 'on') and
          (state_attr('climate.sundance_spa', 'current_temperature') | float(99)) <=
          (state_attr('climate.sundance_spa', 'temperature') | float(0)) - 1 -%}{%- set f =
          states('sensor.sundance_spa_primary_filter') -%}{%- if
          is_state('binary_sensor.sundance_spa_heater', 'on') -%}{{ 'Heating' if f == 'Off' else f ~
          ' · Heating' }}{%- elif blocked -%}{{ '' if f == 'Off' else f ~ ' · ' }}Heating blocked
          ({{ m }} until {{ '17:00' if m == 'Eco' else '07:00' }}){%- else -%}{{ f }}{%- endif -%}
        icon: >-
          {%- set m = states('sensor.sundance_spa_heater_mode') -%}{%- set h = now().hour -%}{%- set
          blocked = ((m == 'Eco' and 7 <= h < 17) or (m == 'Day' and not (7 <= h < 17))) and not
          is_state('binary_sensor.sundance_spa_heater', 'on') and
          (state_attr('climate.sundance_spa', 'current_temperature') | float(99)) <=
          (state_attr('climate.sundance_spa', 'temperature') | float(0)) - 1 -%}{{ 'mdi:fire' if
          is_state('binary_sensor.sundance_spa_heater', 'on') else ('mdi:fire-off' if blocked else
          'mdi:hot-tub') }}
        icon_color: >-
          {%- set m = states('sensor.sundance_spa_heater_mode') -%}{%- set h = now().hour -%}{%- set
          blocked = ((m == 'Eco' and 7 <= h < 17) or (m == 'Day' and not (7 <= h < 17))) and not
          is_state('binary_sensor.sundance_spa_heater', 'on') and
          (state_attr('climate.sundance_spa', 'current_temperature') | float(99)) <=
          (state_attr('climate.sundance_spa', 'temperature') | float(0)) - 1 -%}{{ 'red' if
          is_state('binary_sensor.sundance_spa_heater', 'on') else ('orange' if blocked else ('grey'
          if is_state('sensor.sundance_spa_primary_filter', 'Off') else 'blue')) }}
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:apexcharts-card
        grid_options:
          columns: full
        graph_span: 24h
        header:
          show: true
          title: Spa Temperature · Last 24 hours
          show_states: true
          colorize_states: true
        yaxis:
          - min: ~33
            max: ~37
            decimals: 1
            apex_config:
              forceNiceScale: true
              tickAmount: 8
            id: temp
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          stroke:
            width: 2
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
          tooltip:
            x:
              format: dd/MM HH:mm
        series:
          - entity: climate.sundance_spa
            attribute: current_temperature
            name: Water
            unit: °C
            color: '#ff9800'
            curve: stepline
            float_precision: 1
            yaxis_id: temp
            show:
              in_header: raw
          - entity: climate.sundance_spa
            name: Heating
            unit: °C
            color: '#f44336'
            curve: stepline
            stroke_width: 3
            float_precision: 1
            yaxis_id: temp
            data_generator: >-
              const r = await hass.callWS({type: 'history/history_during_period', start_time:
              start.toISOString(), end_time: end.toISOString(), entity_ids: ['climate.sundance_spa',
              'binary_sensor.sundance_spa_heating_run'], minimal_response: false, no_attributes:
              false, significant_changes_only: false}); const temps = (r['climate.sundance_spa'] ||
              []).map(s => [(s.lu || s.lc) * 1000, (s.a || {}).current_temperature, (s.a ||
              {}).hvac_action]); const runs = []; let on = null; for (const s of
              (r['binary_sensor.sundance_spa_heating_run'] || [])) { const t = (s.lu || s.lc) *
              1000; if (s.s === 'on' && on === null) on = t; else if (s.s !== 'on' && on !== null) {
              runs.push([on, t]); on = null; } } if (on !== null) runs.push([on, end.getTime()]);
              const out = []; for (const [a, b] of runs) { const from = a - 10000; const before =
              temps.filter(x => x[0] <= from); if (before.length) out.push([from,
              before[before.length - 1][1]]); for (const x of temps) if (x[0] > from && x[0] <= b)
              out.push([x[0], x[1]]); const last = temps.filter(x => x[0] <= b); if (last.length)
              out.push([b, last[last.length - 1][1]]); out.push([b + 1, null]); } return out;
            show:
              in_header: false
          - entity: climate.sundance_spa
            attribute: temperature
            name: Target
            unit: °C
            color: '#2196f3'
            curve: stepline
            stroke_dash: 4
            float_precision: 1
            yaxis_id: temp
            show:
              in_header: raw
        visibility:
          - condition: state
            entity: sensor.sundance_spa_temperature_format
            state_not: °F
        card_mod:
          style: >-
            {%- set w = state_attr('climate.sundance_spa', 'current_temperature') | float(0) -%}{%-
            set g = state_attr('climate.sundance_spa', 'temperature') | float(0) -%}{%- set c =
            '#f44336' if g > w else ('#ff9800' if g == w else '#2196f3') -%}#header__states >
            *:nth-child(2) > *:first-child > *:first-child { color: {{ c }} !important; }
        update_delay: 7s
      - type: custom:apexcharts-card
        grid_options:
          columns: full
        graph_span: 24h
        header:
          show: true
          title: Spa Temperature · Last 24 hours
          show_states: true
          colorize_states: true
        yaxis:
          - id: temp
            min: ~91
            max: ~99
            decimals: 0
            apex_config:
              forceNiceScale: true
              tickAmount: 8
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          stroke:
            width: 2
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
          tooltip:
            x:
              format: dd/MM HH:mm
        series:
          - entity: climate.sundance_spa
            attribute: current_temperature
            name: Water
            unit: °F
            color: '#ff9800'
            curve: stepline
            float_precision: 0
            yaxis_id: temp
            transform: 'return x === null ? null : Math.round(x * 9 / 5 + 32);'
            show:
              in_header: false
          - entity: climate.sundance_spa
            name: Heating
            unit: °F
            color: '#f44336'
            curve: stepline
            stroke_width: 3
            float_precision: 0
            yaxis_id: temp
            data_generator: >-
              const r = await hass.callWS({type: 'history/history_during_period', start_time:
              start.toISOString(), end_time: end.toISOString(), entity_ids: ['climate.sundance_spa',
              'binary_sensor.sundance_spa_heating_run'], minimal_response: false, no_attributes:
              false, significant_changes_only: false}); const temps = (r['climate.sundance_spa'] ||
              []).map(s => [(s.lu || s.lc) * 1000, (s.a || {}).current_temperature, (s.a ||
              {}).hvac_action]); const runs = []; let on = null; for (const s of
              (r['binary_sensor.sundance_spa_heating_run'] || [])) { const t = (s.lu || s.lc) *
              1000; if (s.s === 'on' && on === null) on = t; else if (s.s !== 'on' && on !== null) {
              runs.push([on, t]); on = null; } } if (on !== null) runs.push([on, end.getTime()]);
              const out = []; for (const [a, b] of runs) { const from = a - 10000; const before =
              temps.filter(x => x[0] <= from); if (before.length) out.push([from,
              before[before.length - 1][1]]); for (const x of temps) if (x[0] > from && x[0] <= b)
              out.push([x[0], x[1]]); const last = temps.filter(x => x[0] <= b); if (last.length)
              out.push([b, last[last.length - 1][1]]); out.push([b + 1, null]); } return out.map(p
              => [p[0], p[1] === null ? null : Math.round(p[1] * 9 / 5 + 32)]);
            show:
              in_header: false
          - entity: climate.sundance_spa
            attribute: temperature
            name: Target
            unit: °F
            color: '#2196f3'
            curve: stepline
            stroke_dash: 4
            float_precision: 0
            yaxis_id: temp
            transform: 'return x === null ? null : Math.round(x * 9 / 5 + 32);'
            show:
              in_header: false
          - entity: sensor.spa_water_f
            name: Water
            unit: °F
            color: '#ff9800'
            float_precision: 0
            yaxis_id: temp
            show:
              in_chart: false
              in_header: raw
          - entity: sensor.spa_target_f
            name: Target
            unit: °F
            color: '#2196f3'
            float_precision: 0
            yaxis_id: temp
            show:
              in_chart: false
              in_header: raw
        visibility:
          - condition: state
            entity: sensor.sundance_spa_temperature_format
            state: °F
        card_mod:
          style: >-
            {%- set w = state_attr('climate.sundance_spa', 'current_temperature') | float(0) -%}{%-
            set g = state_attr('climate.sundance_spa', 'temperature') | float(0) -%}{%- set w = (w *
            9 / 5 + 32) | round(0) -%}{%- set g = (g * 9 / 5 + 32) | round(0) -%}{%- set c =
            '#f44336' if g > w else ('#ff9800' if g == w else '#2196f3') -%}#header__states >
            *:nth-child(2) > *:first-child > *:first-child { color: {{ c }} !important; }
        update_delay: 7s
      - type: custom:mushroom-template-card
        entity: sensor.spa_next_plan
        primary: Next Plan
        secondary: '{{ states(''sensor.spa_next_plan'') }}'
        icon: mdi:calendar-clock
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /home-control/hot-tub-plans
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.spa_next_plan
            state_not:
              - none
              - unknown
              - unavailable
        card_mod:
          style: 'ha-card { --card-secondary-font-size: 10px; --ha-tile-info-secondary-font-size: 10px; }'
      - type: button
        icon: mdi:cog
        name: Settings
        grid_options:
          columns: 6
          rows: 2
        tap_action:
          action: navigate
          navigation_path: /home-control/hot-tub-settings
      - type: button
        icon: mdi:calendar-clock
        name: Scheduled Plans
        grid_options:
          columns: 6
          rows: 2
        tap_action:
          action: navigate
          navigation_path: /home-control/hot-tub-plans
  - type: grid
    cards:
      - type: heading
        heading: Energy
        heading_style: title
        icon: mdi:lightning-bolt
      - type: custom:mushroom-template-card
        entity: sensor.sundance_spa_power
        primary: Energy
        secondary: >-
          Now {{ states('sensor.sundance_spa_power') | float(0) | round(0) | int }} W · Today {{
          states('sensor.sundance_spa_energy_today') | float(0) | round(1) }} · Week {{
          states('sensor.sundance_spa_energy_week') | float(0) | round(1) }} · Month {{
          states('sensor.sundance_spa_energy_month') | float(0) | round(1) }} kWh
        icon: mdi:lightning-bolt
        icon_color: amber
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        card_mod:
          style: 'ha-card { --card-secondary-font-size: 10px; --ha-tile-info-secondary-font-size: 10px; }'
      - type: energy-date-selection
        grid_options:
          columns: full
      - type: statistics-graph
        title: Hot Tub Energy
        entities:
          - entity: sensor.sundance_spa_energy_total
            name: Hot Tub
        stat_types:
          - change
        chart_type: bar
        energy_date_selection: true
        hide_legend: true
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Soaking
        heading_style: title
        icon: mdi:hot-tub
      - type: custom:mushroom-template-card
        entity: input_datetime.last_soak
        primary: Last Soak
        secondary: >-
          {%- set a = state_attr('input_datetime.last_soak', 'timestamp') | float(0) -%}{%- set b =
          state_attr('input_datetime.spa_previous_soak', 'timestamp') | float(0) -%}{{ 'None' if a <
          172800 else a | timestamp_custom('%d/%m %H:%M') }} · Previous Soak: {{ 'None' if b <
          172800 else b | timestamp_custom('%d/%m %H:%M') }}
        icon: mdi:hot-tub
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: sensor.sundance_spa_soaking_time_today
        primary: Soaking Time
        secondary: >-
          {%- macro d(e) -%}{%- set m = states(e) | float(0) | round(0) | int -%}{%- if m < 60 -%}{{
          m }}m{%- elif m % 60 == 0 -%}{{ m // 60 }}h{%- else -%}{{ m // 60 }}h {{ m % 60 }}m{%-
          endif -%}{%- endmacro -%}{%- macro c(e) -%}{{ states(e) | float(0) | int }}{%- endmacro
          -%}Today {{ d('sensor.sundance_spa_soaking_time_today') }} (×{{
          c('sensor.sundance_spa_soaking_count_today') }}) · Week {{
          d('sensor.sundance_spa_soaking_time_week') }} (×{{
          c('sensor.sundance_spa_soaking_count_week') }}) · Month {{
          d('sensor.sundance_spa_soaking_time_month') }} (×{{
          c('sensor.sundance_spa_soaking_count_month') }})
        icon: mdi:hot-tub
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        card_mod:
          style: 'ha-card { --card-secondary-font-size: 10px; --ha-tile-info-secondary-font-size: 10px; }'
  - type: grid
    cards:
      - type: heading
        heading_style: title
        icon: mdi:wrench-clock
        heading: Maintenance
      - type: custom:mushroom-template-card
        entity: input_datetime.last_maintenance
        primary: Last Maintenance
        secondary: >-
          {%- set t = state_attr('input_datetime.last_maintenance', 'timestamp') | float(0) -%}{%-
          set due = today_at('08:00') + timedelta(days=(as_local(as_datetime(t)).date() -
          now().date()).days + 8) -%}{%- if due <= now() -%}{%- set due = today_at('08:00') if
          today_at('08:00') > now() else today_at('08:00') + timedelta(days=1) -%}{%- endif -%}{{ t
          | timestamp_custom('%d/%m %H:%M') }} · Next {{ due.strftime('%d/%m %H:%M') }}
        icon: mdi:flask-outline
        icon_color: white
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 1
      - type: custom:mushroom-template-card
        entity: input_datetime.last_rinse_filter
        primary: Filter - Last Rinse
        secondary: >-
          {%- set t = state_attr('input_datetime.last_rinse_filter', 'timestamp') | float(0) -%}{%-
          set due = today_at('08:00') + timedelta(days=(as_local(as_datetime(t)).date() -
          now().date()).days + 30) -%}{%- if due <= now() -%}{%- set due = today_at('08:00') if
          today_at('08:00') > now() else today_at('08:00') + timedelta(days=1) -%}{%- endif -%}{{ t
          | timestamp_custom('%d/%m %H:%M') }} · Next {{ due.strftime('%d/%m %H:%M') }}
        icon: mdi:shower-head
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: input_datetime.spa_last_bromine
        primary: Last Bromine
        secondary: >-
          {%- set t = state_attr('input_datetime.spa_last_bromine', 'timestamp') | float(0) -%}{%-
          set due = today_at('08:00') + timedelta(days=(as_local(as_datetime(t)).date() -
          now().date()).days + 4) -%}{%- if due <= now() -%}{%- set due = today_at('08:00') if
          today_at('08:00') > now() else today_at('08:00') + timedelta(days=1) -%}{%- endif -%}{{
          'Not set' if t < 172800 else t | timestamp_custom('%d/%m %H:%M') }} · Next {{
          due.strftime('%d/%m %H:%M') }}
        icon: mdi:bottle-tonic-plus
        icon_color: green
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 1
  - type: grid
    cards:
      - type: heading
        heading: Service
        heading_style: title
        icon: mdi:wrench
      - type: custom:mushroom-template-card
        entity: sensor.sundance_spa_last_replacement_clearray_bulb_date
        primary: ClearRay - Last Replacement
        secondary: >-
          {%- set r = states('sensor.sundance_spa_remaining_days_clearray_bulb') -%}{{
          states('sensor.sundance_spa_last_replacement_clearray_bulb_date') }} · {{ 'Remaining ' ~
          (r | int) ~ ' days' if r | is_number else r }}
        icon: mdi:lightbulb-fluorescent-tube
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: sensor.sundance_spa_last_replacement_water_date
        primary: Water - Last Replacement
        secondary: >-
          {%- set r = states('sensor.sundance_spa_remaining_days_water_refresh') -%}{{
          states('sensor.sundance_spa_last_replacement_water_date') }} · {{ 'Remaining ' ~ (r | int)
          ~ ' days' if r | is_number else r }}
        icon: mdi:water-sync
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: input_datetime.last_replacement_filter_date
        primary: Filter - Last Replacement
