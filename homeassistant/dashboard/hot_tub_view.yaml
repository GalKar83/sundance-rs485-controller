          {%- set t = state_attr('input_datetime.last_replacement_filter_date', 'timestamp') |
          float(0) -%}{%- set r = states('sensor.sundance_spa_remaining_days_filter_change') -%}{{
          'Unknown' if t < 172800 else t | timestamp_custom('%d/%m/%Y') }} · {{ 'Remaining ' ~ (r |
          int) ~ ' days' if r | is_number else r }}
        icon: mdi:air-filter
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
  - type: grid
    cards:
      - type: heading
        heading: Run Time
        heading_style: title
        icon: mdi:timer-outline
      - type: custom:mushroom-template-card
        entity: sensor.sundance_spa_heater_time_today
        primary: Heater
        secondary: >-
          {%- macro d(e) -%}{%- set m = (states(e) | float(0) * 60) | round(0) | int -%}{%- if m <
          60 -%}{{ m }}m{%- elif m % 60 == 0 -%}{{ m // 60 }}h{%- else -%}{{ m // 60 }}h {{ m % 60
          }}m{%- endif -%}{%- endmacro -%}{%- macro c(e) -%}{{ states(e) | float(0) | int }}{%-
          endmacro -%}Today {{ d('sensor.sundance_spa_heater_time_today') }} (×{{
          c('sensor.sundance_spa_heater_count_today') }}) · Week {{
          d('sensor.sundance_spa_heater_time_week') }} (×{{
          c('sensor.sundance_spa_heater_count_week') }}) · Month {{
          d('sensor.sundance_spa_heater_time_month') }} (×{{
          c('sensor.sundance_spa_heater_count_month') }})
        icon: mdi:fire
        icon_color: red
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        card_mod:
          style: 'ha-card { --card-secondary-font-size: 10px; --ha-tile-info-secondary-font-size: 10px; }'
      - type: custom:mushroom-template-card
        entity: input_text.spa_last_heating
        primary: Last Heating
        secondary: '{{ states(''input_text.spa_last_heating'') }}'
        icon: mdi:fire
        icon_color: red
