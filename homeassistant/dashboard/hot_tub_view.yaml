title: Hot Tub
path: hot-tub
icon: mdi:hot-tub
subview: true
back_path: /home-control/home
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: custom:mushroom-template-card
        primary: 'Spa alert: change the filter'
        secondary: The Filter Change counter reached 0. Shown until the counter is reset.
        icon: mdi:air-filter
        icon_color: red
        multiline_secondary: true
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: full
        card_mod:
          style: 'ha-card { border: 2px solid var(--error-color); }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_remaining_days_filter_change
            state: Change Now
      - type: custom:mushroom-template-card
        primary: 'Spa alert: change the ClearRay bulb'
        secondary: The ClearRay Bulb counter reached 0. Shown until the counter is reset.
        icon: mdi:lightbulb-fluorescent-tube
        icon_color: red
        multiline_secondary: true
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: full
        card_mod:
          style: 'ha-card { border: 2px solid var(--error-color); }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_remaining_days_clearray_bulb
            state: Change Now
      - type: custom:mushroom-template-card
        primary: 'Spa alert: change the water'
        secondary: The Water Refresh counter reached 0. Shown until the counter is reset.
        icon: mdi:water-sync
        icon_color: red
        multiline_secondary: true
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: full
        card_mod:
          style: 'ha-card { border: 2px solid var(--error-color); }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_remaining_days_water_refresh
            state: Change Now
      - type: custom:mushroom-template-card
        primary: '{{ ''Spa error: '' ~ states(''sensor.sundance_spa_alert'') }}'
        secondary: >-
          {%- set m = {'Flow switch open (FL-1)': 'The flow switch reads open, so the heater is disabled.
          Usually the pump 1 filter is very dirty or an air lock formed at the pump intake: clean the
          filter and let the air out. Call your dealer if it stays.', 'Flow switch closed (FL-2)': 'The
          flow switch reads closed when it should be open, so the heater is disabled. Call your dealer or
          service organization.', 'Temperature sensor fault (SN)': 'A temperature sensor is not working
          (high-limit sensor SN-1 or water sensor SN-2), so the heater is disabled. Call your dealer or
          service organization.', 'Controller temperature too high': 'The temperature of the controller is
          above the limit. Shade the equipment side of the spa; if it persists, call your dealer or
          service organization.', 'Change depth filter': 'It is time to replace the depth filter (Jacuzzi
          code, not expected on a Sundance).', 'Water too hot - do not enter the water': 'The water is
          above the safe limit (44 °C) and the spa is deactivated. Do not enter the water. Remove the
          cover to cool it faster; if it persists, call your dealer or service organization.', 'Shorted
          flow switch at start-up': 'The flow switch was found shorted at start-up and the system is
          disabled. Call your dealer or service organization.', 'Shorted flow switch and freeze at
          start-up': 'The flow switch was found shorted at start-up together with a freeze condition. Call
          your dealer or service organization.', 'Water 20 F below set point (COOL), heating': 'The water
          is more than 11 °C (20 °F) below the set point, so the heater and pump 1 run until it is within
          8 °C (15 °F). No action is needed; it is common after filling with cold water.', 'Potential
          freeze (ICE), pumps running': 'A freeze condition may be starting, so the pumps and heater run
          until the danger has passed. No action is needed; call your dealer if it persists.', 'Light
          sensor fault': 'The light sensor is not working. Call your dealer or service organization.',
          'Stereo communication trouble': 'The stereo has trouble communicating with the spa. Call your
          dealer or service organization.'} -%}{%- set s = states('sensor.sundance_spa_alert') -%}{{ m[s]
          if s in m else 'The spa reported an error code that is not in the table of known codes. Read the
          message on the spa panel, look it up in the owner\'s manual (section 13), and tell Claude what
          it says so it can be added. The heater may be disabled.' }}
        icon: mdi:alert-octagon
        icon_color: red
        multiline_secondary: true
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: full
        card_mod:
          style: 'ha-card { border: 2px solid var(--error-color); }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_alert
            state_not:
              - None
              - Change Filter
              - Change Water
              - Change ClearRay Bulb
              - unavailable
              - unknown
      - type: heading
        heading: Control Panel
        heading_style: title
        icon: mdi:camera-control
      - type: tile
        entity: switch.sundance_spa_jet_1
        name: Jet 1
        grid_options:
          columns: 6
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Jet 1
        secondary: '{{ states(''switch.sundance_spa_jet_1'') | capitalize }} · locked'
        icon: mdi:lock
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Service Lock
        grid_options:
          columns: 6
      - type: tile
        entity: switch.sundance_spa_jet_2
        name: Jet 2
        grid_options:
          columns: 6
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Jet 2
        secondary: '{{ states(''switch.sundance_spa_jet_2'') | capitalize }} · locked'
        icon: mdi:lock
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Service Lock
        grid_options:
          columns: 6
      - type: tile
        entity: switch.sundance_spa_circulation
        name: Manual
        grid_options:
          columns: 6
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Manual
        secondary: '{{ states(''switch.sundance_spa_circulation'') | capitalize }} · locked'
        icon: mdi:lock
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Service Lock
        grid_options:
          columns: 6
      - type: tile
        entity: binary_sensor.sundance_spa_circulation_auto
        name: Auto
        icon: mdi:sync
        grid_options:
          columns: 6
        color: blue
      - type: custom:mushroom-template-card
        entity: select.sundance_spa_light
        primary: Light
        secondary: '{{ states(''select.sundance_spa_light'') }}'
        icon: mdi:lightbulb
        icon_color: >-
          {% set s = states('select.sundance_spa_light') %}{% set colors =
          {'Blue':'blue','Violet':'purple','Red':'red','Amber':'amber','Green':'green','Aqua':'cyan','Near
          White':'white','High Speed Blend':'pink','Low Speed Blend':'pink','Frozen
          Blend':'light-blue'} %}{{ colors.get(s, 'grey') }}
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Light
        secondary: '{{ states(''select.sundance_spa_light'') }} · locked'
        icon: mdi:lightbulb
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Service Lock
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: climate.sundance_spa
        primary: Temperature
        secondary: >-
          {%- set pf = is_state('sensor.sundance_spa_temperature_format', '°F') -%}{%- set w =
          state_attr('climate.sundance_spa', 'current_temperature') | float(0) -%}{%- set g =
          state_attr('climate.sundance_spa', 'temperature') | float(0) -%}{%- if pf -%}Water {{ (w *
          9 / 5 + 32) | round(0) | int }}°F · Target {{ (g * 9 / 5 + 32) | round(0) | int }}°F{%-
          else -%}Water {{ '%.1f' % w }}°C · Target {{ '%.1f' % g }}°C{%- endif -%}
        icon: mdi:thermometer
        icon_color: orange
        tap_action:
          action: more-info
        grid_options:
          columns: 8
          rows: 1
        card_mod:
          style: 'ha-card { --card-secondary-font-size: 10px; --ha-tile-info-secondary-font-size: 10px; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Temperature Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Temperature
        secondary: >-
          {%- set pf = is_state('sensor.sundance_spa_temperature_format', '°F') -%}{%- set w =
          state_attr('climate.sundance_spa', 'current_temperature') | float(0) -%}{%- set g =
          state_attr('climate.sundance_spa', 'temperature') | float(0) -%}{%- if pf -%}Water {{ (w *
          9 / 5 + 32) | round(0) | int }}°F · Target {{ (g * 9 / 5 + 32) | round(0) | int }}°F{%-
          else -%}Water {{ '%.1f' % w }}°C · Target {{ '%.1f' % g }}°C{%- endif -%} · locked
        icon: mdi:thermometer
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: >-
            ha-card { --card-secondary-font-size: 10px; --ha-tile-info-secondary-font-size: 10px; }
            ha-card { opacity: 0.45; }
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Temperature Lock
              - Service Lock
        grid_options:
          columns: 8
          rows: 1
      - type: custom:mushroom-template-card
        primary: ''
        secondary: ''
        layout: vertical
        icon: mdi:minus
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: script.spa_target_step
          data:
            direction: -1
        grid_options:
          columns: 2
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Temperature Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: ''
        secondary: Locked
        icon: mdi:minus
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Temperature Lock
              - Service Lock
        grid_options:
          columns: 2
          rows: 1
        layout: vertical
      - type: custom:mushroom-template-card
        primary: ''
        secondary: ''
        layout: vertical
        icon: mdi:plus
        icon_color: red
        tap_action:
          action: perform-action
          perform_action: script.spa_target_step
          data:
            direction: 1
        grid_options:
          columns: 2
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Temperature Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: ''
        secondary: Locked
        icon: mdi:plus
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Temperature Lock
              - Service Lock
        grid_options:
          columns: 2
          rows: 1
        layout: vertical
      - type: custom:mushroom-template-card
        entity: sensor.sundance_spa_primary_filter
        primary: Current Status
        secondary: >-
          {%- set m = states('sensor.sundance_spa_heater_mode') -%}{%- set h = now().hour -%}{%- set
          blocked = ((m == 'Eco' and 7 <= h < 17) or (m == 'Day' and not (7 <= h < 17))) and not
          is_state('binary_sensor.sundance_spa_heater', 'on') and
          (state_attr('climate.sundance_spa', 'current_temperature') | float(99)) <=
          (state_attr('climate.sundance_spa', 'temperature') | float(0)) - 1 -%}{%- set f =
          states('sensor.sundance_spa_primary_filter') -%}{%- if
          is_state('binary_sensor.sundance_spa_heater', 'on') -%}{{ 'Heating' if f == 'Off' else f ~
          ' · Heating' }}{%- elif blocked -%}{{ '' if f == 'Off' else f ~ ' · ' }}Heating blocked
          ({{ m }} until {{ '17:00' if m == 'Eco' else '07:00' }}){%- else -%}{{ f }}{%- endif -%}
        icon: >-
          {%- set m = states('sensor.sundance_spa_heater_mode') -%}{%- set h = now().hour -%}{%- set
          blocked = ((m == 'Eco' and 7 <= h < 17) or (m == 'Day' and not (7 <= h < 17))) and not
          is_state('binary_sensor.sundance_spa_heater', 'on') and
          (state_attr('climate.sundance_spa', 'current_temperature') | float(99)) <=
          (state_attr('climate.sundance_spa', 'temperature') | float(0)) - 1 -%}{{ 'mdi:fire' if
          is_state('binary_sensor.sundance_spa_heater', 'on') else ('mdi:fire-off' if blocked else
          'mdi:hot-tub') }}
        icon_color: >-
          {%- set m = states('sensor.sundance_spa_heater_mode') -%}{%- set h = now().hour -%}{%- set
          blocked = ((m == 'Eco' and 7 <= h < 17) or (m == 'Day' and not (7 <= h < 17))) and not
          is_state('binary_sensor.sundance_spa_heater', 'on') and
          (state_attr('climate.sundance_spa', 'current_temperature') | float(99)) <=
          (state_attr('climate.sundance_spa', 'temperature') | float(0)) - 1 -%}{{ 'red' if
          is_state('binary_sensor.sundance_spa_heater', 'on') else ('orange' if blocked else ('grey'
          if is_state('sensor.sundance_spa_primary_filter', 'Off') else 'blue')) }}
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: sensor.spa_audio
        primary: Spa Audio
        secondary: >-
          {%- set w = states('sensor.spa_audio') -%}{{ w }}{{ ' · ' ~
          states('sensor.spa_audio_now_playing') if w not in ['Not connected', 'unknown',
          'unavailable'] else '' }}
        icon: >-
          {{ 'mdi:bluetooth-audio' if states('sensor.spa_audio') not in ['Not connected', 'unknown',
          'unavailable'] else 'mdi:bluetooth-off' }}
        icon_color: >-
          {{ 'blue' if states('sensor.spa_audio') not in ['Not connected', 'unknown', 'unavailable']
          else 'grey' }}
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        card_mod:
          style: 'ha-card { --card-secondary-font-size: 10px; --ha-tile-info-secondary-font-size: 10px; }'
        visibility:
          - condition: state
            entity: sensor.spa_audio
            state:
              - Person 1
              - Person 2
              - Not connected
      - type: custom:mushroom-template-card
        primary: ''
        secondary: ''
        layout: vertical
        icon: mdi:skip-previous
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: script.spa_audio_control
          data:
            command: previous
        grid_options:
          columns: 4
          rows: 1
        visibility:
          - condition: state
            entity: sensor.spa_audio
            state:
              - Person 1
              - Person 2
      - type: custom:mushroom-template-card
        primary: ''
        secondary: ''
        layout: vertical
        icon: >-
          {{ 'mdi:play' if states('sensor.spa_audio_now_playing').startswith('Paused') else
          'mdi:pause' }}
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: script.spa_audio_control
          data:
            command: toggle
        grid_options:
          columns: 4
          rows: 1
        visibility:
          - condition: state
            entity: sensor.spa_audio
            state:
              - Person 1
              - Person 2
      - type: custom:mushroom-template-card
        primary: ''
        secondary: ''
        layout: vertical
        icon: mdi:skip-next
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: script.spa_audio_control
          data:
            command: next
        grid_options:
          columns: 4
          rows: 1
        visibility:
          - condition: state
            entity: sensor.spa_audio
            state:
              - Person 1
              - Person 2
      - type: custom:apexcharts-card
        grid_options:
          columns: full
        graph_span: 24h
        header:
          show: true
          title: Spa Temperature · Last 24 hours
          show_states: true
          colorize_states: true
        yaxis:
          - min: ~33
            max: ~37
            decimals: 1
            apex_config:
              forceNiceScale: true
              tickAmount: 8
            id: temp
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          stroke:
            width: 2
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
          tooltip:
            x:
              format: dd/MM HH:mm
        series:
          - entity: climate.sundance_spa
            attribute: current_temperature
            name: Water
            unit: °C
            color: '#ff9800'
            curve: stepline
            float_precision: 1
            yaxis_id: temp
            show:
              in_header: raw
              in_chart: false
          - entity: climate.sundance_spa
            attribute: temperature
            name: Target
            unit: °C
            color: '#2196f3'
            curve: stepline
            stroke_dash: 4
            float_precision: 1
            yaxis_id: temp
            show:
              in_header: raw
              in_chart: false
          - entity: climate.sundance_spa
            name: Water line
            unit: °C
            color: '#ff9800'
            curve: stepline
            float_precision: 1
            yaxis_id: temp
            data_generator: >-
              const r = await hass.callWS({type: 'history/history_during_period', start_time:
              start.toISOString(), end_time: end.toISOString(), entity_ids:
              ['climate.sundance_spa'], minimal_response: false, no_attributes: false,
              significant_changes_only: false}); const st = r['climate.sundance_spa'] || []; const
              out = []; for (let i = 0; i < st.length; i++) { const t = Math.max((st[i].lu ||
              st[i].lc) * 1000, start.getTime()); const v = (st[i].a || {}).current_temperature;
              const ok = typeof v === 'number'; const tn = (i + 1 < st.length) ? (st[i + 1].lu ||
              st[i + 1].lc) * 1000 : end.getTime(); out.push([t, ok ? v : null]); if (ok)
              out.push([Math.max(tn - 1, t), v]); } return out;
            show:
              in_header: false
          - entity: climate.sundance_spa
            name: Heating
            unit: °C
            color: '#f44336'
            curve: stepline
            stroke_width: 3
            float_precision: 1
            yaxis_id: temp
            data_generator: >-
              const r = await hass.callWS({type: 'history/history_during_period', start_time:
              start.toISOString(), end_time: end.toISOString(), entity_ids: ['climate.sundance_spa',
              'binary_sensor.sundance_spa_heating_run'], minimal_response: false, no_attributes:
              false, significant_changes_only: false}); const temps = (r['climate.sundance_spa'] ||
              []).map(s => [(s.lu || s.lc) * 1000, (s.a || {}).current_temperature, (s.a ||
              {}).hvac_action]); const runs = []; let on = null; for (const s of
              (r['binary_sensor.sundance_spa_heating_run'] || [])) { const t = (s.lu || s.lc) *
              1000; if (s.s === 'on' && on === null) on = t; else if (s.s !== 'on' && on !== null) {
              runs.push([on, t]); on = null; } } if (on !== null) runs.push([on, end.getTime()]);
              const out = []; for (const [a, b] of runs) { const from = a - 10000; const before =
              temps.filter(x => x[0] <= from); if (before.length) out.push([from,
              before[before.length - 1][1]]); for (const x of temps) if (x[0] > from && x[0] <= b)
              out.push([x[0], x[1]]); const last = temps.filter(x => x[0] <= b); if (last.length)
              out.push([b, last[last.length - 1][1]]); out.push([b + 1, null]); } return out;
            show:
              in_header: false
          - entity: climate.sundance_spa
            name: Target line
            unit: °C
            color: '#2196f3'
            curve: stepline
            stroke_dash: 4
            float_precision: 1
            yaxis_id: temp
            data_generator: >-
              const r = await hass.callWS({type: 'history/history_during_period', start_time:
              start.toISOString(), end_time: end.toISOString(), entity_ids:
              ['climate.sundance_spa'], minimal_response: false, no_attributes: false,
              significant_changes_only: false}); const st = r['climate.sundance_spa'] || []; const
              out = []; for (let i = 0; i < st.length; i++) { const t = Math.max((st[i].lu ||
              st[i].lc) * 1000, start.getTime()); const v = (st[i].a || {}).temperature; const ok =
              typeof v === 'number'; const tn = (i + 1 < st.length) ? (st[i + 1].lu || st[i + 1].lc)
              * 1000 : end.getTime(); out.push([t, ok ? v : null]); if (ok) out.push([Math.max(tn -
              1, t), v]); } return out;
            show:
              in_header: false
        visibility:
          - condition: state
            entity: sensor.sundance_spa_temperature_format
            state_not: °F
        card_mod:
          style: >-
            {%- set w = state_attr('climate.sundance_spa', 'current_temperature') | float(0) -%}{%-
            set g = state_attr('climate.sundance_spa', 'temperature') | float(0) -%}{%- set c =
            '#f44336' if g > w else ('#ff9800' if g == w else '#2196f3') -%}#header__states >
            *:nth-child(2) > *:first-child > *:first-child { color: {{ c }} !important; }
        update_delay: 7s
      - type: custom:apexcharts-card
        grid_options:
          columns: full
        graph_span: 24h
        header:
          show: true
          title: Spa Temperature · Last 24 hours
          show_states: true
          colorize_states: true
        yaxis:
          - id: temp
            min: ~91
            max: ~99
            decimals: 0
            apex_config:
              forceNiceScale: true
              tickAmount: 8
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          stroke:
            width: 2
          xaxis:
            labels:
