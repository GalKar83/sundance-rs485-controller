              st[i].lc) * 1000, start.getTime()); const v0 = (st[i].a || {}).temperature; const ok =
              typeof v0 === 'number'; const v = ok ? Math.round(v0 * 9 / 5 + 32) : null; const tn =
              (i + 1 < st.length) ? (st[i + 1].lu || st[i + 1].lc) * 1000 : end.getTime();
              out.push([t, v]); if (ok) out.push([Math.max(tn - 1, t), v]); } return out;
