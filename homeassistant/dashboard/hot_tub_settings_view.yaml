title: Hot Tub Settings
path: hot-tub-settings
icon: mdi:cog
subview: true
back_path: /home-control/hot-tub
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Spa Settings
        heading_style: title
        icon: mdi:hot-tub
      - type: markdown
        content: >-
          Changes go through the spa's menu and take from a few seconds to about a minute; they are
          not possible while the panel is locked.
        grid_options:
          columns: full
      - type: heading
        heading: Heating
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: select.sundance_spa_heater_mode_setting
        primary: Heater Mode
        secondary: '{{ states(''select.sundance_spa_heater_mode_setting'') }}'
        icon: mdi:radiator
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Heater Mode
        secondary: '{{ states(''select.sundance_spa_heater_mode_setting'') }} · locked'
        icon: mdi:radiator
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
              - Service Lock
        grid_options:
          columns: full
          rows: 1
      - type: markdown
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: select.sundance_spa_heater_mode_setting
            state_not: Auto
        content: >-
          {% set m = states('select.sundance_spa_heater_mode_setting') %}<small>**{{ m }}** heats
          only {{ '17:00-07:00 (next day)' if m == 'Eco' else '07:00-17:00' }} by the spa clock.
          Filtering is not affected.</small>
      - type: heading
        heading: Primary Filter
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: input_select.spa_set_pf_start
        primary: Start
        secondary: '{{ states(''input_select.spa_set_pf_start'') }}'
        icon: mdi:clock-start
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Start
        secondary: '{{ states(''input_select.spa_set_pf_start'') }} · locked'
        icon: mdi:clock-start
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
              - Service Lock
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: select.sundance_spa_primary_filter_cycles_setting
        primary: Cycles
        secondary: >-
          {%- set x = states('select.sundance_spa_primary_filter_cycles_setting') -%}{{ (x ~ ' per
          day') if x | is_number else x }}
        icon: mdi:sync
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Cycles
        secondary: >-
          {%- set x = states('select.sundance_spa_primary_filter_cycles_setting') -%}{{ (x ~ ' per
          day') if x | is_number else x }} · locked
        icon: mdi:sync
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
              - Service Lock
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: select.sundance_spa_primary_filter_duration_setting
        primary: Duration
        secondary: >-
          {%- set x = states('select.sundance_spa_primary_filter_duration_setting') -%}{{ x ~ ('
          hour' if x == '1' else ' hours') if x | is_number else x }}
        icon: mdi:timer-outline
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
          - condition: state
            entity: select.sundance_spa_primary_filter_cycles_setting
            state_not: '8'
      - type: custom:mushroom-template-card
        primary: Duration
        secondary: >-
          {%- set x = states('select.sundance_spa_primary_filter_duration_setting') -%}{{ x ~ ('
          hour' if x == '1' else ' hours') if x | is_number else x }} · locked
        icon: mdi:timer-outline
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
              - Service Lock
          - condition: state
            entity: select.sundance_spa_primary_filter_cycles_setting
            state_not: '8'
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        primary: Duration
        secondary: 1 hour · fixed with 8 cycles a day
        icon: mdi:timer-outline
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: select.sundance_spa_primary_filter_cycles_setting
            state: '8'
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: heading
        heading: Service Counters
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: input_select.spa_set_filter_change
        primary: Filter Change
        secondary: >-
          {%- set x = states('input_select.spa_set_filter_change') -%}{{ (x ~ ' days') if x |
          is_number else x }}
        icon: mdi:air-filter
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Filter Change
        secondary: >-
          {%- set x = states('input_select.spa_set_filter_change') -%}{{ (x ~ ' days') if x |
          is_number else x }} · locked
        icon: mdi:air-filter
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
              - Service Lock
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: input_select.spa_set_clearray
        primary: ClearRay
        secondary: >-
          {%- set x = states('input_select.spa_set_clearray') -%}{{ (x ~ ' days') if x | is_number
          else x }}
        icon: mdi:lightbulb-fluorescent-tube
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: ClearRay
        secondary: >-
          {%- set x = states('input_select.spa_set_clearray') -%}{{ (x ~ ' days') if x | is_number
          else x }} · locked
        icon: mdi:lightbulb-fluorescent-tube
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
              - Service Lock
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: input_select.spa_set_water_refresh
        primary: Water Refresh
        secondary: >-
          {%- set x = states('input_select.spa_set_water_refresh') -%}{{ (x ~ ' days') if x |
          is_number else x }}
        icon: mdi:water-sync
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Water Refresh
        secondary: >-
          {%- set x = states('input_select.spa_set_water_refresh') -%}{{ (x ~ ' days') if x |
          is_number else x }} · locked
        icon: mdi:water-sync
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
              - Service Lock
        grid_options:
          columns: full
          rows: 1
      - type: heading
        heading: Panel
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: select.sundance_spa_temperature_format_setting
        primary: Temperature Format
        secondary: '{{ states(''select.sundance_spa_temperature_format_setting'') }}'
        icon: mdi:temperature-celsius
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Temperature Format
        secondary: '{{ states(''select.sundance_spa_temperature_format_setting'') }} · locked'
        icon: mdi:temperature-celsius
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
              - Service Lock
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: input_select.spa_set_lock
        primary: Lock
        secondary: '{{ states(''input_select.spa_set_lock'') }}'
        icon: mdi:lock
        icon_color: '{{ ''blue'' if states(''input_select.spa_set_lock'') == ''Off'' else ''orange'' }}'
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: markdown
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: input_select.spa_set_lock
            state_not: 'Off'
        content: >-
          {% set l = states('input_select.spa_set_lock') %}<small>**{{ l }}**: {{ {'Access Lock':
          'disables manual operation and adjustment of every spa function. Scheduled operations,
          such as filtration cycles, still run.', 'Temperature Lock': 'only the temperature up/down
          buttons are locked. Everything else works.', 'Settings Lock': 'user settings cannot be
          changed. Jets and light still work.', 'Service Lock': 'locks all functions so the spa can
          be serviced. It releases itself after 2 hours. Choose Off to release it earlier; the spa
          then runs a purge of about 2 minutes.'}.get(l, '') }} Controls this lock blocks are greyed
          out below and on the Hot Tub page.</small>
      - type: heading
        heading: Clock
        heading_style: subtitle
      - type: tile
        entity: sensor.sundance_spa_clock_time
        name: Spa Time
        icon: mdi:clock-outline
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.sundance_spa_clock_date
        name: Spa Date
        icon: mdi:calendar
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.sundance_spa_clock_sync
        name: Last Sync
        icon: mdi:clock-check-outline
        grid_options:
          columns: 6
          rows: 1
      - type: custom:mushroom-template-card
        entity: button.sundance_spa_clock_sync_now
        primary: Sync Clock
        secondary: ''
        icon: mdi:clock-edit-outline
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.sundance_spa_clock_sync_now
          confirmation:
            text: Sync the spa clock now? The ESP will go through the spa menu.
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.sundance_spa_clock_sync_now
          confirmation:
            text: Sync the spa clock now? The ESP will go through the spa menu.
        hold_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.sundance_spa_clock_sync_now
          confirmation:
            text: Sync the spa clock now? The ESP will go through the spa menu.
        grid_options:
          columns: 6
          rows: 1
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Sync Clock
        secondary: Locked
        icon: mdi:clock-edit-outline
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
              - Service Lock
        grid_options:
          columns: 6
          rows: 1
  - type: grid
    cards:
      - type: heading
        heading: Power Values
        heading_style: title
        icon: mdi:flash
      - type: markdown
        content: >-
          Used for the energy estimate; kept on the ESP. Change them only if you measured your own
          spa.
        grid_options:
          columns: full
      - type: tile
        entity: number.sundance_spa_power_heater
        name: Heater
        color: red
        grid_options:
          columns: 6
      - type: tile
        entity: number.sundance_spa_power_jet_pump
        name: Jet Pump
        color: blue
        grid_options:
          columns: 6
      - type: tile
        entity: number.sundance_spa_power_circulation
        name: Circulation
        color: cyan
        grid_options:
          columns: 6
      - type: tile
        entity: number.sundance_spa_power_clearray
        name: ClearRay
        color: purple
        grid_options:
          columns: 6
      - type: tile
        entity: number.sundance_spa_power_light
        name: Light
        color: amber
        grid_options:
          columns: 6
      - type: tile
        entity: number.sundance_spa_power_controller
        name: Controller
        color: grey
        grid_options:
          columns: 6
      - type: custom:mushroom-template-card
        primary: Power measurement · last 24 hours
        secondary: >-
          {% macro summ(raw, label, unit_word, setting) -%}{%- set cutoff = (as_timestamp(now()) -
          86400) / 60 -%}{%- set ns = namespace(n=0, skip=0, m=0, p=0) -%}{%- for it in
          raw.split(';') if it -%}{%- set f = it.split(',') -%}{%- if f[0] | float(0) >= cutoff
          -%}{%- if f | count >= 3 -%}{%- set ns.n = ns.n + 1 -%}{%- set ns.m = ns.m + f[1] |
          float(0) -%}{%- set ns.p = ns.p + f[2] | float(0) -%}{%- else -%}{%- set ns.skip = ns.skip
          + 1 -%}{%- endif -%}{%- endif -%}{%- endfor -%}{%- if ns.n > 0 -%}{{ label }}: {{ ns.n }}
          {{ unit_word }}{{ '' if ns.n == 1 else 's' }} measured, average {{ (ns.m / ns.n) |
          round(0) | int }} W vs setting {{ setting | round(0) | int }} W ({{ '%+.1f' % (ns.p /
          ns.n) }}%){{ ', ' ~ ns.skip ~ ' skipped' if ns.skip > 0 else '' }}.{%- else -%}{{ label
          }}: no valid measurement{{ ' (' ~ ns.skip ~ ' skipped)' if ns.skip > 0 else '' }}.{%-
          endif -%}{%- endmacro -%}{{ summ(states('input_text.spa_power_measure_circulation'),
          'Circulation', 'night', states('number.sundance_spa_power_circulation') | float(370)) }}
          {{ summ(states('input_text.spa_power_measure_jet_pump'), 'Jet pump', 'soak',
          states('number.sundance_spa_power_jet_pump') | float(1630)) }}
        icon: mdi:scale-balance
        icon_color: grey
        multiline_secondary: true
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Notifications
        heading_style: title
        icon: mdi:bell
      - type: markdown
        grid_options:
          columns: full
        content: >-
          <small>No spa message reaches the phone during the quiet hours. Messages are collected and
          delivered together when they end; questions with buttons are asked then.</small>
      - type: custom:mushroom-template-card
        primary: >-
          Quiet hours · {{ states('input_datetime.spa_quiet_hours_start')[0:5] }} – {{
          states('input_datetime.spa_quiet_hours_end')[0:5] }}
        icon: >-
          {{ 'mdi:bell-sleep' if is_state('binary_sensor.spa_quiet_hours', 'on') else
          'mdi:bell-ring' }}
        icon_color: '{{ ''purple'' if is_state(''binary_sensor.spa_quiet_hours'', ''on'') else ''green'' }}'
        hold_action:
          action: none
        grid_options:
          columns: full
          rows: 1
        secondary: >-
          {%- set q = is_state('binary_sensor.spa_quiet_hours', 'on') -%}{%- set w =
          states('input_text.spa_night_alerts') -%}{%- set n = (w.split('; ') | count) if w not in
          ['', 'unknown', 'unavailable'] else 0 -%}{{ ('Active now · until ' ~
          states('input_datetime.spa_quiet_hours_end')[0:5]) if q else ('Not active · starts at ' ~
          states('input_datetime.spa_quiet_hours_start')[0:5]) }}{{ ' · ' ~ n ~ ' message(s) waiting
          - tap to send now' }}
        tap_action:
          action: perform-action
          perform_action: script.spa_deliver_night_alerts_now
        visibility:
          - condition: state
            entity: binary_sensor.spa_quiet_hours
            state: 'on'
          - condition: state
            entity: input_text.spa_night_alerts
            state_not:
              - ''
              - unknown
              - unavailable
      - type: custom:mushroom-template-card
        primary: >-
          Quiet hours · {{ states('input_datetime.spa_quiet_hours_start')[0:5] }} – {{
          states('input_datetime.spa_quiet_hours_end')[0:5] }}
        icon: >-
          {{ 'mdi:bell-sleep' if is_state('binary_sensor.spa_quiet_hours', 'on') else
          'mdi:bell-ring' }}
        icon_color: '{{ ''purple'' if is_state(''binary_sensor.spa_quiet_hours'', ''on'') else ''green'' }}'
        hold_action:
          action: none
        grid_options:
          columns: full
          rows: 1
        secondary: >-
          {%- set q = is_state('binary_sensor.spa_quiet_hours', 'on') -%}{%- set w =
          states('input_text.spa_night_alerts') -%}{%- set n = (w.split('; ') | count) if w not in
          ['', 'unknown', 'unavailable'] else 0 -%}{{ ('Active now · until ' ~
          states('input_datetime.spa_quiet_hours_end')[0:5]) if q else ('Not active · starts at ' ~
          states('input_datetime.spa_quiet_hours_start')[0:5]) }} · tap to edit
        tap_action:
          action: navigate
          navigation_path: /home-control/hot-tub-quiet-hours
        visibility:
          - condition: or
            conditions:
              - condition: state
                entity: binary_sensor.spa_quiet_hours
                state: 'off'
              - condition: state
                entity: input_text.spa_night_alerts
                state:
                  - ''
                  - unknown
                  - unavailable
  - type: grid
    cards:
      - type: heading
        heading: Diagnostics
        heading_style: title
        icon: mdi:stethoscope
      - type: tile
        entity: binary_sensor.sundance_spa_status
        name: Status
        icon: mdi:lan-connect
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.sundance_spa_wifi_signal
        name: Wi-Fi Signal
        icon: mdi:wifi
        grid_options:
          columns: 4
      - type: custom:mushroom-template-card
        entity: button.sundance_spa_read_settings
        primary: Read Settings
        secondary: ''
        icon: mdi:book-open-variant
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.sundance_spa_read_settings
          confirmation:
            text: Read the settings from the spa now? The ESP will go through the spa menu.
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.sundance_spa_read_settings
          confirmation:
            text: Read the settings from the spa now? The ESP will go through the spa menu.
        hold_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.sundance_spa_read_settings
          confirmation:
            text: Read the settings from the spa now? The ESP will go through the spa menu.
        grid_options:
          columns: 6
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state_not:
              - Access Lock
              - Settings Lock
              - Service Lock
      - type: custom:mushroom-template-card
        primary: Read Settings
        secondary: Locked
        icon: mdi:book-open-variant
        icon_color: grey
        tap_action:
          action: none
        hold_action:
          action: none
        icon_tap_action:
          action: none
        card_mod:
          style: ' ha-card { opacity: 0.45; }'
        visibility:
          - condition: state
            entity: sensor.sundance_spa_lock
            state:
              - Access Lock
              - Settings Lock
