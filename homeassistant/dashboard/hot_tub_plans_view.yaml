      - type: button
        icon: mdi:plus-circle
        name: Add plan
        grid_options:
          columns: full
        tap_action:
          action: perform-action
          perform_action: script.spa_plan_add
      - type: markdown
        content: >-
          **Ready by** - the water is at the temperature at that time (heating starts in time from
          the Heat Rate). **Start heating** - heating starts at that time. A one-off plan disappears
          once it has run; repeating plans stay until deleted with the trash button; tap the switch
          icon of a plan to pause or resume it without deleting it. After the soak, or 2 h after the
          water should be ready, the phone asks: back to the previous temperature, keep it, or set a
          new one.
        grid_options:
          columns: full
      - type: custom:mushroom-template-card
        entity: input_number.spa_heat_rate
        primary: Heat Rate
        secondary: >-
          {%- set r = states('input_number.spa_heat_rate') | float(0) -%}{{ ((r * 1.8) | round(1) ~
          ' °F/hour') if is_state('sensor.sundance_spa_temperature_format', '°F') else (r | round(1)
          ~ ' °C/hour') }}
        icon: mdi:thermometer-chevron-up
        icon_color: red
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 1
      - type: custom:mushroom-number-card
        entity: input_number.spa_ready_by_margin
        name: Safety Margin
        display_mode: slider
        icon_color: orange
        grid_options:
          columns: 12
          rows: 1
        layout: horizontal
