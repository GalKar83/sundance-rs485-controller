title: Scheduled Plans
path: hot-tub-plans
icon: mdi:calendar-clock
subview: true
back_path: /home-control/hot-tub
type: sections
max_columns: 1
sections:
  - type: grid
    cards:
      - type: heading
        heading: Heating Plans
        heading_style: title
        icon: mdi:calendar-clock
      - type: markdown
        content: No heating plans. Add one below.
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: input_text.spa_plan_1
            state:
              - ''
              - unknown
              - unavailable
          - condition: state
            entity: input_text.spa_plan_2
            state:
              - ''
              - unknown
              - unavailable
          - condition: state
            entity: input_text.spa_plan_3
            state:
              - ''
              - unknown
              - unavailable
          - condition: state
            entity: input_text.spa_plan_4
            state:
              - ''
              - unknown
              - unavailable
          - condition: state
            entity: input_text.spa_plan_5
            state:
              - ''
              - unknown
              - unavailable
      - type: custom:mushroom-template-card
        entity: input_text.spa_plan_1
        primary: >-
          {%- set p = states('input_text.spa_plan_1').split(';') -%}{%- if p | count == 5 -%}{%- set
          c = p[1] | float(0) -%}{%- set t = ((c * 9 / 5 + 32) | round(0) | int ~ '°F') if
          is_state('sensor.sundance_spa_temperature_format', '°F') else (('%g' % c) ~ '°C') -%}{%-
          if p[3] == 'once' -%}{%- set when = 'today' if p[4] == (now().date() | string) else
          ('tomorrow' if p[4] == ((now() + timedelta(days=1)).date() | string) else 'on ' ~
          as_datetime(p[4]).strftime('%a %d/%m')) -%}{%- elif p[3] == 'daily' -%}{%- set when =
          'every day' -%}{%- else -%}{%- set names = {'6': 'Sunday', '0': 'Monday', '1': 'Tuesday',
          '2': 'Wednesday', '3': 'Thursday', '4': 'Friday', '5': 'Saturday'} -%}{%- set ns =
          namespace(d=[]) -%}{%- for k in ['6', '0', '1', '2', '3', '4', '5'] -%}{%- if k in p[3]
          -%}{%- set ns.d = ns.d + [names[k] if p[3] | length == 1 else names[k][:3]] -%}{%- endif
          -%}{%- endfor -%}{%- set when = 'every ' ~ ns.d | join(', ') -%}{%- endif -%}{%- if p[0]
          == 'R' -%}Ready by {{ p[2] }} {{ when }} · {{ t }}{%- else -%}Heat from {{ p[2] }} {{ when
          }} · {{ t }}{%- endif -%}{%- endif -%}
        secondary: '{{ ''Paused'' if is_state(''input_boolean.spa_plan_1_on'', ''off'') else '''' }}'
        icon: >-
          {{ 'mdi:toggle-switch' if is_state('input_boolean.spa_plan_1_on', 'on') else
          'mdi:toggle-switch-off-outline' }}
        icon_color: '{{ ''green'' if is_state(''input_boolean.spa_plan_1_on'', ''on'') else ''grey'' }}'
        grid_options:
          columns: 10
          rows: 1
        visibility:
          - condition: state
            entity: input_text.spa_plan_1
            state_not:
              - ''
              - unknown
              - unavailable
        tap_action:
          action: none
        icon_tap_action:
          action: perform-action
          perform_action: input_boolean.toggle
          target:
            entity_id: input_boolean.spa_plan_1_on
        card_mod:
          style: 'ha-card { --card-primary-font-size: 11px; --ha-tile-info-primary-font-size: 11px; }'
      - type: custom:mushroom-template-card
        primary: ''
        secondary: ''
        layout: vertical
        icon: mdi:trash-can-outline
        icon_color: red
        tap_action:
          action: perform-action
          perform_action: script.spa_plan_delete
          data:
            slot: 1
          confirmation:
            text: Delete this heating plan?
        grid_options:
          columns: 2
          rows: 1
        visibility:
          - condition: state
            entity: input_text.spa_plan_1
            state_not:
              - ''
              - unknown
              - unavailable
      - type: custom:mushroom-template-card
        entity: input_text.spa_plan_2
