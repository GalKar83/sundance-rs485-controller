        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: input_select.spa_plan_mode
        primary: Mode
        secondary: '{{ states(''input_select.spa_plan_mode'') }}'
        icon: mdi:tune
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: input_select.spa_plan_repeat
        primary: Repeat
        secondary: '{{ states(''input_select.spa_plan_repeat'') }}'
        icon: mdi:repeat
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: input_select.spa_plan_temperature
        primary: Temperature
        secondary: '{{ states(''input_select.spa_plan_temperature'') }}'
        icon: mdi:thermometer
        icon_color: blue
        features:
          - type: select-options
        features_position: inline
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: custom:mushroom-template-card
        entity: input_datetime.spa_plan_when
        primary: When
        secondary: >-
          {%- set t = state_attr('input_datetime.spa_plan_when', 'timestamp') | float(0) -%}{{ t |
          timestamp_custom('%H:%M') if not is_state('input_select.spa_plan_repeat', 'Once') else t |
          timestamp_custom('%d/%m %H:%M') }}
        icon: mdi:calendar-clock
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: full
          rows: 1
      - type: markdown
        content: <small>A repeating plan uses only the time.</small>
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: input_select.spa_plan_repeat
            state_not: Once
      - type: tile
        entity: input_boolean.spa_plan_sun
        name: Sun
        hide_state: true
        vertical: true
        grid_options:
          columns: 3
          rows: 1
        visibility:
          - condition: state
            entity: input_select.spa_plan_repeat
            state: Chosen days
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle
        hold_action:
          action: none
      - type: tile
        entity: input_boolean.spa_plan_mon
